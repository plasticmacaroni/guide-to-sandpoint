<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season of Ghosts — A Chronicle of Willowshore</title>
<meta name="description" content="An illustrated chronicle of the Season of Ghosts campaign — the town of Willowshore, one year and one hundred and fifteen.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Cinzel:wght@500;600&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- atmosphere -->
  <div id="mood-bg"></div>
  <canvas id="fireflies"></canvas>
  <div class="fog fog--a"></div>
  <div class="fog fog--b"></div>
  <div class="vignette"></div>

  <!-- animated film grain -->
  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grainFilter)"/>
  </svg>

  <!-- chrome -->
  <div class="progress" id="progress"></div>
  <nav class="chapnav" id="chapnav" aria-label="Chapters"></nav>

  <!-- the story renders here -->
  <main id="app"></main>

  <script src="data/story.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
